# Publish @enclave-technologies/pqc-primitives (npm) and enclave-pqc-primitives (crates.io).
# Requires a one-time manual first publish, then Trusted Publishers on npm + crates.io.
# Create a GitHub Release (tag e.g. v0.1.0) or use workflow_dispatch to publish.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npm (OIDC Trusted Publishing)
        run: npm publish --access public --provenance

  publish-crates:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
