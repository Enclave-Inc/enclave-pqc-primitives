[workspace]
resolver = "2"
members = [".", "bindings/wasm"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[package]
name = "enclave-pqc-primitives"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "NIST-aligned post-quantum cryptographic primitives for Enclave SDKs"
license.workspace = true
readme = "README.md"
repository = "https://github.com/Enclave-Inc/enclave-pqc-primitives"
keywords = ["post-quantum", "ml-kem", "ml-dsa", "cryptography", "fips"]
categories = ["cryptography"]

# ---------------------------------------------------------------------------
# Dependency review (see README "Dependencies"):
#   RustCrypto:        aes-gcm, ml-kem, ml-dsa, sha3, zeroize
#   FLAGGED (review):  serde / serde_json (dev-only; reserved for future ACVP)
# ---------------------------------------------------------------------------

[dependencies]
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "getrandom", "rand_core", "zeroize"] }
ml-kem = { version = "=0.3.2", default-features = false, features = ["alloc", "getrandom", "hazmat", "zeroize"] }
sha3 = { version = "=0.10.8", default-features = false }
zeroize = { version = "=1.8.1", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
# FLAGGED — not RustCrypto / not NIST-reference code. Reserved for future
# official NIST ACVP JSON fixtures (Category 5).
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
